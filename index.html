    <style>
        /* ==========================================================
           KBLAM84 — CHANGE THESE SETTINGS

           SPIN SPEED: time for ONE complete rotation.
           2000ms = 2 seconds       (slow)
           1000ms = 1 second
            500ms = half a second   (2 turns per second)
            200ms = 0.2 seconds     (5 turns per second)

           Both LEFT bottles spin clockwise.
           Both RIGHT bottles spin counterclockwise.
           Change just the number below to experiment.
           ========================================================== */
        :root {
            --spin-speed: 500ms;
            --corner-bottle-height: 205px;
            --main-bottle-height: 630px;
            --title-size: 42px;
            --subtitle-size: 22px; /* smaller Gothic welcome line */
            --caption-size: 42px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: "Times New Roman", Times, serif;
        }

        /* The whole first screen scales together on desktop.
           At 1200px wide it matches the proportions of your Paint mockup. */
        .stage {
            position: relative;
            width: min(100%, 1200px, calc(100svh * 1200 / 940));
            aspect-ratio: 1200 / 940;
            margin: 0 auto;
            container-type: inline-size;
            overflow: hidden;
        }

        .site-heading {
            position: absolute;
            top: 4.2%;
            left: 0;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: min(var(--title-size), 3.5cqw);
            font-weight: normal;
            letter-spacing: .14em;
            line-height: 1.1;
        }

        .subtitle {
            margin: 5px 0 0;
            font-family: "UnifrakturMaguntia", "Times New Roman", serif;
            font-size: min(var(--subtitle-size), 1.84cqw);
            font-weight: normal;
            line-height: 1.2;
            letter-spacing: 0;
            /* Modern y, but keep the rest of the historic blackletter. */
            font-feature-settings: "cv03";
        }

        /* The big bottle NEVER spins. */
        .main-bottle {
            position: absolute;
            top: 15.2%;
            left: 50%;
            transform: translateX(-50%);
            display: block;
            width: auto;
            height: min(var(--main-bottle-height), 52.5cqw);
            max-width: 36%;
            object-fit: contain;
        }

        /* Each corner is a fixed SQUARE. The bottle rotates inside it.
           This is what prevents the enormous corner bottles from before. */
        .corner {
            position: absolute;
            width: min(calc(var(--corner-bottle-height) * 1.12), 19cqw);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }

        .corner img {
            display: block;
            flex: none;
            width: auto;
            height: 89%;
            max-width: 89%;
            object-fit: contain;
            transform-origin: center center;
            -webkit-user-drag: none;
            will-change: transform;
        }

        .top-left     { top: 1.8%; left: 0; }
        .top-right    { top: 1.8%; right: 0; }
        .bottom-left  { bottom: 4.4%; left: 0; }
        .bottom-right { bottom: 4.4%; right: 0; }

        .clockwise {
            animation: clockwise var(--spin-speed) linear infinite;
        }
        .counterclockwise {
            animation: counterclockwise var(--spin-speed) linear infinite;
        }

        @keyframes clockwise {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes counterclockwise {
            from { transform: rotate(0deg); }
            to   { transform: rotate(-360deg); }
        }

        /* Your actual bottom text, not the old placeholders. */
        .caption {
            position: absolute;
            top: 85.2%;
            left: 50%;
            transform: translateX(-50%);
            width: 62%;
            text-align: center;
            font-size: min(var(--caption-size), 3.5cqw);
            font-weight: normal;
            line-height: 1.15;
        }
        .caption p { margin: 0 0 .28em; }
        .caption p:last-child { margin-bottom: 0; }

        /* Phones: keep the same idea, but give it a taller canvas.
           The corner bottles stay small and the text remains readable. */
        @media (max-width: 600px) {
            .stage {
                width: 100%;
                height: max(100svh, 620px);
                aspect-ratio: auto;
            }

            .site-heading { top: 3%; }
            h1 { font-size: clamp(27px, 8cqw, 38px); }
            .subtitle {
                font-size: clamp(13px, 4.2cqw, 20px);
                margin-top: 4px;
            }

            .corner {
                width: min(30cqw, 120px);
            }
            .top-left, .top-right { top: 1.5%; }
            .bottom-left, .bottom-right { bottom: 2%; }

            .main-bottle {
                top: 17%;
                height: min(52svh, 480px, 116cqw);
                max-width: 43%;
            }

            .caption {
                top: 72%;
                width: 96%;
                font-size: clamp(16px, 4.6cqw, 24px);
                line-height: 1.25;
            }
        }

        /* The original shrine fills the first viewport. The next section
           starts immediately below it, so a short scroll reveals it. */
        .first-screen {
            min-height: 100svh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .first-screen .stage {
            flex: none;
        }

        /* ==========================================================
           RESEARCH SECTION — CHANGE THESE SETTINGS IF YOU WANT
           This is independent of the bottle shrine above.
           ========================================================== */
        :root {
            --research-top-padding: 16px;

        .research-section {

        .research-section h2 {

        }
        .research-section .research-description {

        }
        .research-section .research-instruction {
            margin: 0 0 16px;
            font-size: clamp(17px, 2.2vw, 23px);
            font-weight: bold;
            line-height: 1.3;
        }
        .donation-link {
            display: inline-block;
            max-width: 100%;
            line-height: 0;
            cursor: pointer;
        }
        .donation-link img {
            display: block;
            width: min(100%, var(--donation-image-width));
            height: auto;

        }
        .donation-link:focus-visible {

        }
        .research-section .research-subject {
            margin: 24px 0 0;
            font-size: clamp(18px, 2.3vw, 24px);
            line-height: 1.3;
        }
